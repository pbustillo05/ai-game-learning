game:
  name: synthetic
  synthetic:
    n_players: 2
    deck_size: 6
    n_suits: 2
    hand_size: 1
    n_rounds: 2
    board_per_round: [0, 1]
    max_raises: 2
    bet_size: [2, 4]
    ante: 1
  poker: null
rollout:
  n_trees: 256
  beta:
    default: 1.0
    round_0: 1.0
    chance_round_1: 2.0
    round_1: 2.0
  node_budget: 512
  reach_storage: full
completion:
  n_samples: 512
  backend: exact
model:
  n_buckets: 512
  hidden_dim: 64
  e_max: 3
loss:
  name: rb_ppo
  lam: 0.95
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.5
  c_h: 0.01
  entropy_schedule: const
  use_suit_consistency: false
training:
  mode: branched_rao_blackwell
  iters: 300
  gd_steps_per_iter: 1
  minibatch_size: 256
  lr: 0.001
  adam_betas: [0.9, 0.999]
  grad_clip: 1.0
  amp: false
  seed: 11
  checkpoint_every: 25
  out_dir: runs/leduc
debug_asserts: true
