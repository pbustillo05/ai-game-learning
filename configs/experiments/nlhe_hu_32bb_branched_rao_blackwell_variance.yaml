schema_version: pbg-branched-rb-variance-v1
checkpoint_dir: runs/nlhe_hu_32bb_full_sequential_rb_from_ckpt_0000020_optimized
checkpoint: 1110
logical_seed: 20260720

# Common-seed coarse screen, followed by a 0.125 refinement around the winner.
beta:
  coarse: [2.0, 2.25, 2.5]
  refine_step: 0.125
  minimum: 2.0
  maximum: 2.5

# One rooted tree is allowed to branch normally until the projected node count
# reaches 4,000.  From that point onward the existing global latch uses beta=1.
rollout:
  roots_per_gpu: 1
  node_budget: 12000
  branching_upper_cutoff_nodes: 4000
  branching_stop_cutoff_nodes: null

stages:
  geometry_repeats: 64
  pilot_trees_per_beta: 8
  final_trees: 32
  maximum_final_trees: 64
  adaptive_block: 8
  target_component_relative_se: 0.10

probes:
  parameter_count: 4
  node_hutchinson_count: 4
  distribution: rademacher

# n_oracle is deliberately large and is not swept.  complete_linear_moments
# measures the coefficient C; reported n values are analytical C/n evaluations.
oracle:
  n_oracle: 8192
  selected_beta_check_samples: 16384
  leaf_rows_per_batch: 16

report:
  B: [32, 64, 128, 256]
  n: [64, 128, 256, 512, 1024]
  selection_reference_B: 64
  selection_reference_n: 1024

streaming:
  directional_rows_per_batch: 16

constraints:
  maximum_allocated_gib: 8.5
  maximum_projected_active_gpu_hours: 24.0

smoke:
  beta: 2.25
  upper_cutoff_nodes: 96
  node_budget: 256
  oracle_samples: 256
  parameter_probes: 1
  node_hutchinson_probes: 1

out_dir: runs/branched_rao_blackwell_variance_ckpt1110
