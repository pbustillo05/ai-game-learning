kind: nlhe_run_v1
scientific:
  mode:
    training_regime: self_play
    rollout_mode: sequential
    private_estimator: sampled
  game:
    players: 2
    stack_bb: 32.0
    rank_count: 13
  model:
    d_model: 128
    n_heads: 4
    layers: 6
    raises:
      components: 2
      minimum_scale: 0.02
    class_embedding_dim: 32
    folder_beta_rank: 0
    folder_line_dim: 8
