      reserve_bytes: 10737418240
    microbatch:
      rollout_rows: 2
      completion_rows: 4
      learner_rows:
        pre: 2
        post_2: 2
  iterations: 1
  checkpoint_every: 1
  output_dir: runs/experiments/nlhe_hu_32bb_normal_h100_pilot_strictfix/runtime/nlhe_hu_32bb_normal_h100_smoke_k1
