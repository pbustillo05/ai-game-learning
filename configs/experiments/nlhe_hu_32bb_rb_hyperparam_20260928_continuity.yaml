# Experiment settings: use experiments.hyperparameter_search.smoke for checkpoint1110 initialization and legacy input adaptation.
kind: nlhe_run_v1
scientific:
  mode:
    training_regime: self_play
    rollout_mode: sequential
    private_estimator: rao_blackwell
  game:
    players: 2
    stack_bb: 32.0
    rank_count: 13
  model:
    d_model: 128
    n_heads: 4
    layers:
      pre: 4
      post: 6
    raises:
      components: 2
      minimum_scale: 0.02
    class_embedding_dim: 32
    folder_beta_rank: 0
    folder_line_dim: 8
    epsilon: 1.0e-08
  objective:
    policy_clip: 0.2
    value:
      kind: clipped
      epsilon: 0.00625
      coefficient: 0.016
    entropy:
      kind: linear_decay
      coefficient: 0.0015625
      iterations: 2
    reference_kl:
      coefficient: 0.00625
      refresh:
        iterations: 1000000000
  optimizer:
    kind: adamw
    learning_rate: 5.0e-05
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
    weight_decay: 0.01
    grad_clip: 0.5
  schedule:
    batch_size: 256
    steps: 6
  lambda: 0.95
  completion:
    samples: 1024
run:
  seed: 918273
  reproducibility: strict
  utility: stack_normalized
  workload:
    roots: 256
  recovery:
    minimum_roots: 256
  execution:
    device: cuda:0
    precision: fp16
    attention: sdpa
    reference_cache: 'off'
    memory:
      reserve_bytes: 1350242468
    microbatch:
      rollout_rows: 64
      completion_rows: 128
      learner_rows: 12
  iterations: 3
  checkpoint_every: 50
  output_dir: runs/experiments/nlhe_hu_32bb_rb_hyperparam_20260928_continuity
