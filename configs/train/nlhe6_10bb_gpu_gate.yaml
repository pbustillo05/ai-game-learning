game:
  n_players: 6
  stack_bb: 10.0
  rank_count: 13
rollout:
  sequential_starts: 1
  beta:
    default: 1.0
    # The hour smoke's median rank-local tree had only eight nodes.  A 1.10
    # preflop intensity is a bounded intermediate gate between 1.0 and the
    # previously unsafe 1.25 setting.
    preflop: 1.10
    flop: 1.25
    turn: 1.25
    river: 1.25
    chance_to_flop: 1.5
    chance_to_turn: 1.25
    chance_to_river: 1.25
  node_budget: 4096
  reach_storage: recompute
completion:
  n_samples: 64
  backend: cuda
model:
  d_model: 96
  n_heads: 4
  n_layers_pre: 2
  n_layers_post: 2
  m_raise: 4
  k_act: 7
  max_players: 6
training:
  mode: branched_rao_blackwell
  iters: 600
  gd_steps_per_iter: 1
  minibatch_size: 32
  lr: 0.0001
  adam_betas: [0.9, 0.999]
  grad_clip: 0.5
  amp: false
  seed: 47
  checkpoint_every: 100
  out_dir: runs/nlhe6_10bb_gpu_gate
  reproducibility: throughput
  # The 100-step reference occasionally incurred a large drift spike in the
  # hour smoke; refresh twice as often for the overnight candidate.
  kl_ref_interval: 50
  optimizer: adamw
loss:
  name: rb_ppo
  lam: 1.0
  clip_eps: 0.2
  clip_eps_v: 0.2
  # At 0.002, the late weighted value term was roughly eight times the policy
  # term while minibatch explained variance remained near zero.
  c_v: 0.0005
  c_h: 0.1
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
