kind: nlhe_run_v1
scientific:
  mode:
    training_regime: self_play
    rollout_mode: sequential
    private_estimator: sampled
  game: {players: 2, stack_bb: 8.0, rank_count: 4}
  model:
    d_model: 16
    n_heads: 4
    layers: {pre: 1, post: 1}
    raises: {components: 2, minimum_scale: 0.02}
    class_embedding_dim: 4
    ffn_hidden: 24
    folder_beta_rank: 0
    folder_line_dim: 8
    epsilon: 1.0e-8
  objective:
    policy_clip: 0.2
    value: {kind: mse, coefficient: 0.5}
    entropy: {kind: constant, coefficient: 0.01}
  optimizer:
    kind: adamw
    learning_rate: 0.0003
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    grad_clip: 1.0
  schedule: {batch_size: 8, epochs: 1}
  lambda: 0.95
run:
  seed: 104830
  reproducibility: strict
  utility: raw_bb
  workload: {roots: 1}
  execution:
    device: cuda:0
    precision: fp32
    attention: sdpa
    memory: {reserve_bytes: 67108864}
    microbatch: auto
  iterations: 1
  checkpoint_every: 1
  output_dir: runs/experiments/nlhe_hu_8bb_normal_smoke
