game:
  n_players: 6
  stack_bb: 10.0
  rank_count: 13
rollout:
  # Sequential modes count independent trajectories here. Poker permits at
  # most 123 public transitions, so 128 nodes safely bounds each path.
  sequential_starts: 32
  beta: null
  node_budget: 128
  reach_storage: recompute
completion:
  n_samples: 64
  backend: cuda
model:
  d_model: 96
  n_heads: 4
  n_layers_pre: 2
  n_layers_post: 2
  m_raise: 4
  k_act: 7
  max_players: 6
training:
  mode: rao_blackwell
  iters: 12
  gd_steps_per_iter: 1
  minibatch_size: 32
  lr: 0.0001
  adam_betas: [0.9, 0.999]
  grad_clip: 0.5
  amp: false
  seed: 59
  checkpoint_every: 12
  out_dir: runs/nlhe6_10bb_sequential_rb_gpu_smoke
  reproducibility: throughput
  kl_ref_interval: 50
  optimizer: adamw
loss:
  name: rb_ppo
  lam: 1.0
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.0005
  c_h: 0.1
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
