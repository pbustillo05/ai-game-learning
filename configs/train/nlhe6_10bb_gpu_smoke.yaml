game:
  n_players: 6
  stack_bb: 10.0
  rank_count: 13
rollout:
  # Branched RB owns exactly one independently sampled tree per rank/GPU.
  sequential_starts: 1
  beta:
    default: 1.0
    preflop: 1.0
    flop: 1.25
    turn: 1.25
    river: 1.25
    chance_to_flop: 1.5
    chance_to_turn: 1.25
    chance_to_river: 1.25
  # Preflop beta above one produced heavy-tailed overflow as exploration was
  # preserved.  Keep 4,096 rows for postflop branching and transient headroom.
  node_budget: 4096
  reach_storage: recompute
completion:
  n_samples: 64
  backend: cuda
model:
  # Same six-seat pre/postflop architecture as the production preset, reduced
  # only in width/depth so a useful calibration fits the local 2080 Ti window.
  d_model: 96
  n_heads: 4
  n_layers_pre: 2
  n_layers_post: 2
  m_raise: 4
  k_act: 7
  max_players: 6
training:
  mode: branched_rao_blackwell
  # The 240-iteration calibration took about ten minutes, with heavy runtime
  # tails.  This is the reusable approximately one-hour follow-up budget.
  iters: 1200
  # One on-policy update avoids the severe clipping seen with repeated reuse
  # during calibration.  Increase reuse only in a separately gated sweep.
  gd_steps_per_iter: 1
  minibatch_size: 32
  lr: 0.0001
  adam_betas: [0.9, 0.999]
  grad_clip: 0.5
  amp: false
  seed: 31
  checkpoint_every: 40
  out_dir: runs/nlhe6_10bb_gpu_smoke_hour
  reproducibility: throughput
  kl_ref_interval: 100
  optimizer: adamw
loss:
  name: rb_ppo
  # Lambda one has the strongest exact end-to-end gradient coverage in the
  # current audit and removes one uncertainty from the first poker run.
  lam: 1.0
  clip_eps: 0.2
  clip_eps_v: 0.2
  # Chip-scale value losses dominated at 0.5; the reduced coefficient keeps
  # the measured weighted value term comparable to the policy term.
  c_v: 0.002
  c_h: 0.1
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
