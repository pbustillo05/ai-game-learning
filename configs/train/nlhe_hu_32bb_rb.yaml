game:
  n_players: 2
  stack_bb: 32.0
  rank_count: 13

rollout:
  # This is explicitly per GPU: a two-rank launch begins with 5,120 global
  # trajectories. A fixed 3,072-root/GPU probe was also safe, so the four-phase
  # controller may widen to that ceiling after measured successful iterations.
  sequential_roots_per_gpu_initial: 2560
  beta: null
  # Exact HU 32 bb bound: 39 player nodes + 3 chance nodes + 1 terminal leaf.
  # Keep rollout queue packs at 64 rows. A 128-row probe exhausted the guarded
  # completion workspace after rollout; larger learner minibatches are split
  # independently into the validated physical SDPA shapes.
  family_batch_rows: 64
  max_active_trajectories: 64
  storage_page_rows: 256
  # The execution arena is separately bounded from retained training storage.
  execution_memory_bytes: 1610612736
  sequential_roots_per_gpu_minimum: 512
  # The fixed 3,072-root/GPU probe peaked at 5.04 GB allocated and 7.37 GB
  # reserved. Admission still accounts for the measured four-phase envelope
  # and the hardware profile's independent VRAM guard.
  sequential_roots_per_gpu_maximum: 3072
  # Eight clean observations are required between 10% upward steps; downward
  # corrections remain immediate. The 32-point window tracks recent geometry.
  memory_calibration_window: 32
  memory_growth_fraction: 0.10
  memory_growth_delay: 8
  memory_prediction_z: 3.0

device: cuda
completion:
  n_samples: 1024

model:
  d_model: 128
  n_heads: 4
  n_layers_pre: 4
  n_layers_post: 6
  m_raise: 2
  k_act: 5
  s_min: 0.02
  n_buckets_line: 64
  max_players: 2
  class_embedding_dim: 32
  evaluator_summary_dim: 0
  ffn_hidden: null
  use_branching_heads: false
  max_history_tokens: 42
  # A continuing heads-up state cannot contain a folded third player.
  folder_beta_rank: 0
  folder_line_dim: 8
  eps: 1.0e-8

training:
  mode: rao_blackwell
  # This is a fresh run initialized from the iteration-20 model weights. At the
  # measured 104.17 s steady-state iteration, 1,110 iterations plus the faster
  # controller ramp project to about 32.1 wall-hours (about 64.2 GPU-hours).
  iters: 1110
  # Preserve 14,848 sampled rows/GPU per iteration: 116 * 128 = 14,848. At
  # 2,560 roots/GPU this is approximately 2x retained-decision reuse; a tested
  # 3,072-root iteration realized 1.70x reuse.
  gd_steps_per_iter: 116
  ppo_epochs: null
  # Two ranks contribute 256 statistical rows per synchronized update. Batch
  # 256 saved less than another 0.5% end-to-end and halves update count again.
  minibatch_size: 128
  lr: 0.00005
  adam_betas: [0.9, 0.999]
  optimizer: adamw
  grad_clip: 0.5
  amp: true
  seed: 101
  # 37 steady-state iterations are about 64 minutes. Since 1,110 = 30 * 37,
  # the run also writes a checkpoint after its final iteration.
  checkpoint_every: 37
  out_dir: runs/nlhe_hu_32bb_full_sequential_rb_from_ckpt_0000020_optimized
  reproducibility: throughput
  # 1,380 iterations * 116 optimizer steps = 160,080 steps per fixed reference.
  kl_ref_interval: 1380

loss:
  name: rb_ppo
  # Player-clock GAE lambda for terminal-only rewards with gamma=1.
  lam: 0.95
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.0005
  # Conservative end of the 0.05--0.2 range selected in IIG PPO studies;
  # PBG's factored raise entropy is not numerically identical to categorical.
  c_h: 0.05
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
