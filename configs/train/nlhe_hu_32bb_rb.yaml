game:
  n_players: 2
  stack_bb: 32.0
  rank_count: 13

rollout:
  # Global logical starts: torchrun partitions this as 2,048 per GPU for a
  # two-rank launch. Three complete iterations realized 6,020--7,119 player
  # decisions/GPU. The exact geometry peaked at 4.59 GiB driver VRAM; the
  # largest later allocator reservation plus 25% was 5.37 GiB against the
  # hardware profile's 8.57 GiB safe limit.
  # Two-rank launch: 2,048 starts/GPU initially. The controller can take the
  # full +25% step to the tested 2,560 starts/GPU ceiling after iteration 1.
  sequential_starts: 4096
  beta: null
  # Exact HU 32 bb bound: 39 player nodes + 3 chance nodes + 1 terminal leaf.
  node_budget: 43
  reach_storage: recompute
  # At 2,048 starts/GPU, 64-row families completed three iterations and cut
  # rollout time from 42.2 s (32 rows) to 33.6 s (64 rows).
  family_batch_rows: 64
  max_active_trajectories: 64
  arena_chunk_nodes: 256
  # Corrected hard rollout bound is 1.06 GiB/GPU; measured accounting high
  # water was 0.92 GiB/GPU. This leaves about 0.44 GiB accounting headroom.
  execution_memory_bytes: 1610612736
  target_decisions_per_gpu: 8000
  min_sequential_starts_per_gpu: 512
  # 4,096/GPU reserved 7.70 GiB even at the minimum active count; its 25%
  # The 2,560/GPU probe realized 7,994 rank-max decisions and a later resumed
  # iteration measured an 8.03 GB allocator peak. The companion 12-hour
  # hardware profile accepts that measured tier while retaining a 25% gate.
  max_sequential_starts_per_gpu: 2560
  decisions_per_start_ema_alpha: 0.2
  max_start_change_fraction: 0.25

completion:
  n_samples: 1024
  backend: cuda

model:
  d_model: 128
  n_heads: 4
  n_layers_pre: 4
  n_layers_post: 6
  m_raise: 2
  k_act: 5
  s_min: 0.02
  n_buckets_line: 64
  max_players: 2
  class_embedding_dim: 32
  evaluator_summary_dim: 0
  ffn_hidden: null
  use_moment_heads: false
  max_history_tokens: 42
  # A continuing heads-up state cannot contain a folded third player.
  folder_beta_rank: 0
  folder_line_dim: 8
  eps: 1.0e-8

training:
  mode: rao_blackwell
  # Measured: 5.76 minutes for the 2,048-start first iteration and about
  # 7.10 minutes at 2,560 starts. 100 iterations project to about 11.8 hours.
  iters: 100
  # Mean realized mass was 6,346 decisions/GPU. 298 * 64 = 19,072 draws gives
  # 3.01x mean reuse and approximately exp(-3.01) = 4.9% unseen.
  gd_steps_per_iter: 298
  ppo_epochs: null
  # Batch 64 completed the tested 2,048-start/GPU geometry; two ranks therefore
  # contribute 128 sampled decision nodes to each synchronized update.
  minibatch_size: 64
  lr: 0.00005
  adam_betas: [0.9, 0.999]
  optimizer: adamw
  grad_clip: 0.5
  amp: true
  seed: 101
  checkpoint_every: 5
  out_dir: runs/nlhe_hu_32bb_sequential_rb
  reproducibility: throughput
  # 537 rollouts * 298 optimizer steps = 160,026 steps per fixed reference,
  # preserving the original approximately 160k-step reference cadence.
  kl_ref_interval: 537
  target_node_reuse: 3.0
  kl_ref_optimizer_steps: 160000

loss:
  name: rb_ppo
  # Player-clock GAE lambda for terminal-only rewards with gamma=1.
  lam: 0.95
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.0005
  # Conservative end of the 0.05--0.2 range selected in IIG PPO studies;
  # PBG's factored raise entropy is not numerically identical to categorical.
  c_h: 0.05
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
