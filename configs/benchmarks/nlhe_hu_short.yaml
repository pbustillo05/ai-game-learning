game:
  name: poker
  poker:
    n_players: 2
    stack_bb: 8.0
    rank_count: 13
rollout:
  n_trees: 1
  beta:
    default: 1.0
    preflop: 1.0
    flop: 1.25
    turn: 1.25
    river: 1.5
    chance_to_flop: 1.25
    chance_to_turn: 1.25
    chance_to_river: 1.25
  node_budget: 256
  reach_storage: recompute
completion:
  n_samples: 8
  backend: cuda
model:
  d_model: 64
  n_heads: 4
  n_layers_pre: 1
  n_layers_post: 2
  m_raise: 2
  k_act: 5
  max_players: 2
training:
  mode: branched_rao_blackwell
  iters: 1
  gd_steps_per_iter: 1
  minibatch_size: 2
  lr: 0.0003
  adam_betas: [0.9, 0.999]
  grad_clip: 1.0
  amp: true
  seed: 31
  checkpoint_every: 1
  out_dir: runs/bench_nlhe_hu_short
  reproducibility: throughput
loss:
  name: rb_ppo
  lam: 0.95
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.5
  c_h: 0.01
  entropy_schedule: const
  value_loss: clipped
