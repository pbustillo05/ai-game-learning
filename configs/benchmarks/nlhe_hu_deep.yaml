  iters: 1
  gd_steps_per_iter: 1
  minibatch_size: 4
  lr: 0.0003
  adam_betas: [0.9, 0.999]
  grad_clip: 1.0
  amp: true
  seed: 41
  checkpoint_every: 1
  out_dir: runs/bench_nlhe_hu_deep
  reproducibility: throughput
loss:
