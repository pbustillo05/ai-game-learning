# Frozen branching diagnostic fixture. This is not a training config.
# The selected scenario is compiled into the embedded ordinary nlhe_run_v1
# specification before any CUDA storage is admitted.

kind: branching_profile_v1
run:
  kind: nlhe_run_v1
  scientific:
    mode:
      training_regime: self_play
      rollout_mode: branched.fixed
      private_estimator: rao_blackwell
    game:
      players: 2
      stack_bb: 32.0
      rank_count: 13
    model:
      d_model: 128
      n_heads: 4
      layers: 6
      raises:
        components: 2
        minimum_scale: 0.02
      class_embedding_dim: 32
      folder_beta_rank: 0
      folder_line_dim: 8
      epsilon: 1.0e-08
    objective:
      policy_clip: 0.2
      value:
        kind: mse
        coefficient: 0.5
      entropy:
        kind: constant
        coefficient: 0.01
      branching:
        trace_coefficient: 1.0
        cost_coefficient: 1.0
        trace_epsilon: 1.0e-06
    optimizer:
      kind: adamw
      learning_rate: 5.0e-05
      beta1: 0.9
      beta2: 0.999
      epsilon: 1.0e-08
      weight_decay: 0.0
      grad_clip: 0.5
    schedule:
      batch_size: 128
      steps: 1
    lambda: 0.95
    branching:
      fixed_beta:
        player: 2.4
        chance: 2.4
      beta_max: 3
      minimum_tree_size: 1000
      cost_safeguard:
        gamma_deviance_max: 1.0
        p95_underprediction_max: 2.0
        consecutive_iterations: 1
    completion:
      samples: 1024
  run:
    seed: 104830
    reproducibility: strict
    utility: raw_bb
    workload:
      roots: 1
      tree_nodes: 25000
    recovery:
      minimum_branch_scale: 0.25
      branch_backoff_factor: 0.5
    execution:
      device: cuda:0
      precision: fp16
      attention: sdpa
      memory:
        reserve_bytes: 536870912
      microbatch:
        rollout_rows: 84
        completion_rows: 8192
        learner_rows: 20
    iterations: 1
    checkpoint_every: 1
    output_dir: runs/experiments/nlhe_hu_32bb_branched_fixed_beta_testing
