      steps: 24
    lambda: 0.95
    completion:
      samples: 1024
  run:
    seed: 918273
    reproducibility: strict
    utility: stack_normalized
    workload:
      roots: 512
    recovery:
      minimum_roots: 512
    execution:
      device: cuda:0
      precision: fp16
      attention: sdpa
      reference_cache:
        budget_bytes: 1073741824
      memory:
        reserve_bytes: 1350242468
      microbatch:
        rollout_rows: 48
        completion_rows: 512
        learner_rows: 12
    iterations: 100000000
    checkpoint_every: 20
    output_dir: runs/experiments/nlhe_hu_32bb_rb_campaign_control
