- name: entropy_half
  overrides:
    control.entropy.initial_coefficient: 0.00078125
  purpose: Lower exploration pressure around normalized historical coefficient
- name: entropy_double
  overrides:
    control.entropy.initial_coefficient: 0.003125
  purpose: Higher exploration pressure while still decaying to exactly zero
- name: entropy_fast
  overrides:
    control.entropy.zero_after_decisions: 125000
  purpose: Separate exploration duration from initial coefficient
- name: entropy_slow
  overrides:
    control.entropy.zero_after_decisions: 1000000
  purpose: Restore the earlier long-decay experiment; finite zero endpoint
- name: learning_rate_slow
  overrides:
    scientific.optimizer.learning_rate: 2.5e-05
  purpose: Bracket historical learning rate in both directions
- name: critic_weight_quarter
  overrides:
    scientific.objective.value.coefficient: 0.004
  purpose: Test weaker critic pressure around the normalized continuity value
- name: critic_clip_wide
  overrides:
    scientific.objective.value.epsilon: 0.025
  purpose: Separate value trust region from value-loss weight; 0.8 bb in normalized
    units
- name: ppo_clip_tight
  overrides:
    scientific.objective.policy_clip: 0.1
  purpose: Test a tighter actor trust region independently of reference KL
- name: lambda_09
  overrides:
    scientific.lambda: 0.9
  purpose: Test return/baseline bias-variance tradeoff at identical workloads
- name: posterior_entropy_only
  overrides:
    control.entropy_clock: posterior_effective_hands
  purpose: Isolate entropy scheduling from reference scheduling
- name: posterior_reference_only
  overrides:
    control.reference_clock: posterior_effective_hands
  purpose: Isolate reference scheduling from entropy scheduling
comparison:
  conditions:
  - sampled
  - rao_blackwell
  selection: One shared scientific profile; equally weight Normal and RB league results
    against a frozen common opponent population
  primary_budget: equal end-to-end training wall time on identical three-GPU allocation
  secondary_axes:
  - global fresh player decisions
  - global roots
  - optimizer steps
  - global learner presentations
  schedule_clock: Fresh player decisions versus raw exact posterior exp(H); no exponent
    or sample-independence claim. Correlation/gradient-noise audit precedes interpretation.
  mode_specific_parameters:
    completion.samples: RB-only estimator computation; fixed at1024, absent for sampled.
      Not a shared loss/schedule search dimension.
