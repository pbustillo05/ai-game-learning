gradient_noise:
  enabled: true
  repetitions: 16
  seed_base: 804000
  roots_per_rank:
  - 512
  - 1024
  - 2048
  batches_per_rank:
  - 128
  - 256
  learner_steps: 1
  objective: policy gradient only; entropy/KL/value coefficients zero
  purpose: measure gradient variance and mean agreement; diagnostic only, no automatic
    clock multiplier
  bootstrap_repetitions: 1000
evaluation:
  primary: balanced randomized round robin, raw zero-sum bb/hand
  shared_population: both modes, every candidate equally weighted; diagonal payoff
    zero
  promotion: fixed equal-hand screening then independent training seeds and fresh
    evaluation deals
  sensitive_br: only regularizer control versus raw posterior clock, both modes; same
    response budget
  limits: population-relative strength; non-transitivity retained in payoff matrix;
    not Nash exploitability
  fixed_anchor: Every policy versus unchanged checkpoint1110; secondary regression
    panel, excluded from automatic selection
study_revision: shared_loss_search_v3
reuse_design:
  quantity: global learner presentations / global fresh trained player decisions
  workload_constraint: B * steps / N = 6 at every registered workload setting
  expected_initial_reuse: about 1.5 at the measured checkpoint-1110 decision length
    of about 4 per root
  important_limit: 'Not exact epochs: realized decision counts change with policy.
    Log actual reuse; no hidden per-mode step adaptation.'
  historical_context:
    july_median_reuse: 1.31
    failed_august_normal_median_reuse: 1.64
    failed_august_rb_median_reuse: 1.76
fixed_parameters_rationale:
  units: stack_normalized in all trials; four value-affine tensors divided by32 on
    initialization
  architecture_and_action_space: fixed to preserve checkpoint compatibility and isolate
    the diagnosed objectives
  adam_betas_epsilon_weight_decay_grad_clip: held at historical control; weaker failure-specific
    evidence than entropy/KL/critic controls
  completion_samples: 1024 for RB; normal has no completion estimator. Keep finite-completion
    precision fixed during the shared scientific search
  excluded: No entropy that stays positive forever; no posterior exponent tuning;
    no large-reuse factorial
  reference_cadence: 100k,400k,and fixed anchor. Another finite interval beyond screen
    exposure would duplicate fixed-anchor behavior
posterior_exposure:
  schema: preterminal-trajectory-weighted-posterior-exposure-v2
  formula: sum_i sum_p decisions(i,p) * exp(H(P(x_p | preterminal_i)))
  normal: one per fresh trained player decision
  posterior: exact HU collision-conditioned marginal from pre-terminal leaf ranges
    before completion sampling
  exponent: 1.0
  completion_sample_count_used: false
selected_profile_path: configs/profiles/nlhe_hu_32bb_shared_loss_selected_v4.json
