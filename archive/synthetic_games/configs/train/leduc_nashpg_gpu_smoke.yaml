game:
  name: synthetic
  synthetic:
    n_players: 2
    deck_size: 6
    n_suits: 2
    hand_size: 1
    n_rounds: 2
    board_per_round: [0, 1]
    max_raises: 2
    bet_size: [2, 4]
    ante: 1
  poker: null
rollout:
  n_trees: 1
  beta:
    default: 1.0
    round_0: 1.0
    chance_round_1: 2.0
    round_1: 2.0
  node_budget: 131072
  reach_storage: full
completion:
  n_samples: 512
  backend: exact
model:
  architecture: mha
  hidden_dim: 64
loss:
  name: rb_ppo
  lam: 0.95
  clip_eps: 0.2
  clip_eps_v: 0.2
  c_v: 0.5
  c_h: 0.1
  c_kl: 0.2
  entropy_schedule: const
  value_loss: clipped
training:
  mode: branched_rao_blackwell
  iters: 300
  # Four reuse steps are the safe translation of four PPO epochs here.  The
  # paper's four-minibatch split is not 16 with-replacement steps in this API.
  gd_steps_per_iter: 4
  minibatch_size: 256
  lr: 0.0003
  adam_betas: [0.9, 0.999]
  grad_clip: 0.5
  amp: true
  seed: 11
  checkpoint_every: 25
  out_dir: runs/leduc_nashpg_gpu_smoke
  reproducibility: strict
  kl_ref_interval: 25
  optimizer: adamw
