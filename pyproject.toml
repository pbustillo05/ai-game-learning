[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg"
version = "0.1.0"
description = "Policy-gradient self-play for public-action Bayesian games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "pytest", "torch>=2.2"]

[project.scripts]
pbg-train = "pbg.cli.train:main"
pbg-benchmark = "pbg.cli.benchmark:main"
pbg-br-eval = "pbg.cli.br_eval:main"
pbg-export-inference = "pbg.cli.export_inference:main"
pbg-inference-benchmark = "pbg.cli.benchmark_inference:main"

[project.optional-dependencies]
mac = ["torch>=2.13; platform_system == 'Darwin' and platform_machine == 'arm64'"]

# Development prerequisite for poker boundaries (kept out of package deps):
# pip install -e ../poker-gpu-evaluator

[tool.setuptools.packages.find]
include = ["pbg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
